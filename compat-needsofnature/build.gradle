plugins {
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'java'
}

version = '1.0.0'
group = 'com.narrafork.playermaid'

base {
    archivesName = 'playermaid-needs-of-nature-compat'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

compileJava {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: rootProject.minecraft_version
}

repositories {
    mavenCentral()
}

def nonJar = providers.gradleProperty('needsofnature_jar')
        .map { file(it) }
        .getOrElse(file('libs/needsofnature-forge-1.20.1-1.2.0.jar'))
def afwJar = providers.gradleProperty('animationframework_jar')
        .map { file(it) }
        .getOrElse(file('libs/animationframework-forge-1.20.1-1.2.0.jar'))

dependencies {
    minecraft "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    compileOnly project(':')
    testImplementation project(':')
    compileOnly fg.deobf(files(nonJar))
    compileOnly fg.deobf(files(afwJar))
    testImplementation fg.deobf(files(nonJar))
    testImplementation fg.deobf(files(afwJar))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

processResources {
    inputs.property 'compat_version', project.version
    filesMatching('META-INF/mods.toml') {
        expand compat_version: project.version
    }
}

test {
    useJUnitPlatform()
}

jar {
    finalizedBy 'reobfJar'

    manifest {
        attributes([
                'Specification-Title': 'playermaid_non_compat',
                'Specification-Vendor': 'Openai:gpt-5.6-sol,yuuka0desu,普天之下',
                'Specification-Version': '1',
                'Implementation-Title': 'Player Maid × Needs of Nature Compat',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Openai:gpt-5.6-sol,yuuka0desu,普天之下',
                'MixinConfigs': 'playermaid_non_compat.mixins.json'
        ])
    }
}
